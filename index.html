<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liturgical Calendar</title>

    <!-- link previews (iMessage, Slack, social media). The daily publish job
         (.github/workflows/publish.yml) rewrites these for today's season;
         see scripts/update-social-image.js -->
    <meta property="og:title" content="Liturgical Calendar">
    <meta property="og:description" content="Ordinary Time">
    <meta property="og:url" content="https://laurelschwulst.github.io/liturgical-calendar/">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://laurelschwulst.github.io/liturgical-calendar/assets/social/ordinary-time.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://laurelschwulst.github.io/liturgical-calendar/assets/social/ordinary-time.png">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <!-- script.js fills in the season and sets its class on <body> -->
    <div id="time">
        <i></i>
    </div>

    <!-- testing easter egg: a small dot, top right. An invisible <select>
         sits on top of it, so clicking the dot opens the native dropdown. -->
    <div id="tester">
        <span id="dot"></span>
        <select id="menu" aria-label="Test other dates"></select>
    </div>
    <script src="assets/js/jquery.min.js"></script>
    <script src="assets/js/calendar.js"></script>
    <script src="assets/js/script.js"></script>
</body>
</html>
